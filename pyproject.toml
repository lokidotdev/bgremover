[project]
name = "bgremover"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxconverter-common>=1.16.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
tensorrt = [
    "tensorrt-cu13-libs>=10,<11",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# ONNX Runtime build: GPU locally (default), CPU in the Docker image (`--no-default-groups --group cpu`).
gpu = [
    "onnxruntime-gpu[cuda,cudnn]>=1.31.0",
]
cpu = [
    "onnxruntime>=1.23",
]

[tool.uv]
default-groups = ["dev", "gpu"]
conflicts = [[{ group = "gpu" }, { group = "cpu" }]]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
